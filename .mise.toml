# Pinned toolchain: the single source of truth for local and CI tool versions.
# `task setup` runs `mise install`; CI uses jdx/mise-action.
[tools]
task = "3.54.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
gitleaks = "8.30.1"
yq = "4.54.3"
jq = "1.8.2"
uv = "0.13.10"
watchexec = "2.8.0"
# OpenTofu, tflint (+ AWS ruleset) and trivy: infra/ checks (task infra:*) and
# the aws-security-evaluation skill. One trivy pin for both.
opentofu = "1.13.10"
tflint = "0.66.0"
"github:terraform-linters/tflint-ruleset-aws" = "0.50.0"
trivy = "0.76.2"
hugo = "0.170.1"
lychee = "0.24.2"
node = "24.22.3"
"pipx:check-jsonschema" = "0.39.0"
"pipx:yamllint" = "1.38.0"
"pipx:gdtoolkit" = "4.5.0"
"aqua:tmux/tmux-builds" = "3.8"
"gem:tmuxinator" = "3.4.2"

[settings]
experimental = true
lockfile = true
