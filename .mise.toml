# Pinned toolchain: the single source of truth for local and CI tool versions.
# `task setup` runs `mise install`; CI uses jdx/mise-action.
[tools]
task = "3.54.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
gitleaks = "8.30.1"
yq = "4.54.3"
jq = "1.8.2"
watchexec = "2.8.0"
"pipx:check-jsonschema" = "0.39.0"
"pipx:yamllint" = "1.38.0"
"pipx:gdtoolkit" = "4.5.0"

[settings]
experimental = true
