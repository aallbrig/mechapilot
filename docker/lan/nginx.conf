# nginx for the LAN preview (#77): compose.yaml runs it unprivileged, with a
# read-only root filesystem and every capability dropped. It serves the tree
# that `task lan:build` assembles in build/lan/www/ over HTTPS only:
#   /           a small index (docker/lan/index.html)
#   /current/   the legacy site, as GitHub Pages serves it today
#   /new/       the Marketing Site, built with baseURL /new/
#   /new/game/  the Godot web export, or a placeholder until it exists
# scripts/checks/nginx-config runs `nginx -t` on this file in the pinned image.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types; # maps .wasm to application/wasm
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

  # The root filesystem is read-only: every temp path is on the /tmp tmpfs.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 1k; # a static site: nothing is uploaded
  disable_symlinks on;     # serve only regular files inside the root

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json
    application/wasm application/xml image/svg+xml application/octet-stream;

  # Security headers match the Production response headers policy
  # (infra/modules/static-site): the Marketing Site's CSP for / and /new/, the
  # Game Site's CSP (wasm compilation and the exported shell's inline script
  # and style) for /new/game/ and the legacy Unity build at /current/.
  # HSTS is left out on purpose: for a self-signed certificate on localhost
  # and a LAN IP it would pin every port of those hosts to HTTPS.
  map $uri $lan_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/new/game/ "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/current/ "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
  }

  # HTML and everything still in development revalidate on every load (nginx
  # sends an ETag); the legacy build is pinned to one commit, so it may be cached.
  map $uri $lan_cache_control {
    default "no-cache";
    ~^/current/ "public, max-age=86400";
  }

  server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lan_tls:1m;
    ssl_session_timeout 1h;

    # nginx listens on 8443 inside the container and the host port differs, so
    # redirects are relative (directory slashes) or keep the client's Host
    # header, port included (plain HTTP sent to this HTTPS port).
    absolute_redirect off;
    error_page 497 =301 https://$http_host$request_uri;

    root /srv/lan/www;
    index index.html;
    autoindex off;

    add_header Content-Security-Policy $lan_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $lan_cache_control always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # No dotfiles (nothing in the tree should have any).
    location ~ /\. {
      return 404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
