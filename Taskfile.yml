# yaml-language-server: $schema=schemas/taskfile.schema.json
version: "3"

# Every verification step is a task. Git hooks and CI call these same targets,
# so local runs and CI can't drift apart.

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install the pinned toolchain and enable git hooks (idempotent)
    cmds:
      - mise trust --quiet .mise.toml
      - mise install
      - git config core.hooksPath .githooks
      - task: doctor

  doctor:
    desc: Verify every required tool is on PATH
    silent: true
    cmds:
      - |
        missing=0
        for t in task shellcheck shfmt actionlint gitleaks yq jq check-jsonschema yamllint gdlint gdformat gh tmux tmuxinator tofu tflint tflint-ruleset-aws trivy; do
          command -v "$t" >/dev/null 2>&1 || { echo "missing: $t"; missing=1; }
        done
        if [ -z "${CI:-}" ] && [ "$(git config core.hooksPath)" != ".githooks" ]; then
          echo "git hooks not enabled (run: task setup)"; missing=1
        fi
        [ "$missing" -eq 0 ] && echo "doctor: ok"
        exit "$missing"

  fmt:
    desc: Format shell and GDScript in place
    cmds:
      - scripts/list-files sh | xargs shfmt -w
      - scripts/list-files gd | xargs gdformat

  lint:
    desc: All static checks (fast)
    cmds:
      - task: lint:sh
      - task: lint:yaml
      - task: lint:actions
      - task: lint:schema
      - task: lint:gd
      - task: infra:validate
      - task: infra:lint
      - task: infra:scan
      - task: checks

  lint:sh:
    desc: POSIX sh, ShellCheck (all optional checks) and shfmt
    cmds:
      - scripts/list-files sh | xargs shellcheck
      - scripts/list-files sh | xargs shfmt -d

  lint:yaml:
    desc: yamllint (strict)
    cmds:
      - yamllint -s .

  lint:actions:
    desc: actionlint on GitHub workflows (runs ShellCheck on run blocks too)
    cmds:
      - actionlint

  lint:schema:
    desc: JSON Schema validation of every config that has a schema
    cmds:
      - check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
      - check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
      - check-jsonschema --schemafile schemas/taskfile.schema.json Taskfile.yml
      - check-jsonschema --schemafile schemas/claude-code-settings.schema.json .claude/settings.json
      - check-jsonschema --check-metaschema schemas/tmuxinator.schema.json
      - scripts/checks/no-erb .tmuxinator.yml
      - check-jsonschema --schemafile schemas/tmuxinator.schema.json .tmuxinator.yml
      - check-jsonschema --check-metaschema schemas/aws-eval-inventory.schema.json schemas/aws-eval-report.schema.json
      - check-jsonschema --schemafile schemas/aws-eval-inventory.schema.json tests/fixtures/aws-eval/inventory-*.json
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "${tmp}"' EXIT
        for skill in .claude/skills/*/SKILL.md; do
          [ -f "${skill}" ] || continue
          name="$(basename "$(dirname "${skill}")")"
          yq --front-matter=extract -o=json '.' "${skill}" >"${tmp}/${name}.json"
          [ "$(jq -r '.name' "${tmp}/${name}.json")" = "${name}" ] || { echo "${skill}: name must match its directory"; exit 1; }
          check-jsonschema --schemafile schemas/claude-skill-frontmatter.schema.json "${tmp}/${name}.json"
        done

  lint:gd:
    desc: gdlint and gdformat --check on all GDScript
    cmds:
      - |
        files="$(scripts/list-files gd)"
        if [ -z "$files" ]; then echo "lint:gd: no GDScript yet"; exit 0; fi
        echo "$files" | xargs gdlint
        echo "$files" | xargs gdformat --check

  checks:
    desc: Repository hygiene checks
    cmds:
      - scripts/checks/safe-filenames
      - scripts/checks/forbidden-paths
      - scripts/checks/large-files
      - scripts/checks/infra-no-identifiers

  infra:validate:
    desc: OpenTofu fmt -check, then offline init (-backend=false) and validate for every module and stack
    cmds:
      - scripts/infra validate

  infra:lint:
    desc: tflint (all terraform rules + the pinned AWS ruleset) on every module and stack
    cmds:
      - scripts/infra lint

  infra:scan:
    desc: trivy misconfiguration scan of infra/ (fails on any HIGH or CRITICAL finding)
    cmds:
      - scripts/infra scan

  infra:plan:
    desc: "Human only: plan a stack with your own AWS credentials (usage: task infra:plan -- [stack]); refuses to run in CI"
    cmds:
      - scripts/infra plan {{.CLI_ARGS}}

  infra:apply:
    desc: "Human only: apply the saved plan of a stack (usage: task infra:apply -- [stack]); refuses to run in CI"
    cmds:
      - scripts/infra apply {{.CLI_ARGS}}

  secrets:
    desc: gitleaks over the full git history
    cmds:
      - gitleaks git --no-banner --redact .

  test:
    desc: Run the test suites (JUnit output in build/test-results)
    cmds:
      - rm -rf build/test-results
      - mkdir -p build/test-results
      - scripts/test-shell
      - |
        if [ ! -d godot ]; then echo "test: no Godot project yet"; exit 0; fi
        task godot:test
      - scripts/checks/test-results-clean

  ci:fast:
    desc: Pre-push gate (lint + tests)
    cmds:
      - task: lint
      - task: test

  ci:
    desc: The full gate (the required `ci` status check runs exactly this)
    cmds:
      - task: ci:fast
      - task: secrets

  dev:
    desc: Start the tmux dev session (.tmuxinator.yml), or attach if it is already running
    interactive: true
    cmds:
      - scripts/dev/session start

  dev:stop:
    desc: Stop the tmux dev session (no-op if it isn't running)
    cmds:
      - scripts/dev/session stop

  dev:check:
    desc: Render .tmuxinator.yml with `tmuxinator debug` and validate the result
    cmds:
      - scripts/dev/session check

  autostart:install:
    desc: "Optional: start the dev session detached at login (launchd on macOS, systemd --user on Linux)"
    cmds:
      - scripts/autostart/autostart install

  autostart:uninstall:
    desc: "Optional: remove the login autostart"
    cmds:
      - scripts/autostart/autostart uninstall

  autostart:status:
    desc: Report whether login autostart is installed and whether the dev session is running
    cmds:
      - scripts/autostart/autostart status

  verify:acceptance:
    desc: "Prove an issue's acceptance criteria (usage: task verify:acceptance -- <issue#>)"
    cmds:
      - scripts/verify-acceptance {{.CLI_ARGS}}

  verify:guard:
    desc: "Classify changes that touch the verification stack (exit 3 = verification change)"
    cmds:
      - scripts/checks/verification-guard

  merge-gate:
    desc: "Decide (and with --merge, perform) a PR merge using main's gate scripts (usage: task merge-gate -- <pr> [--merge])"
    cmds:
      - scripts/merge-gate {{.CLI_ARGS}}
