# yaml-language-server: $schema=schemas/taskfile.schema.json
version: "3"

# Every verification step is a task. Git hooks and CI call these same targets,
# so local runs and CI can't drift apart.

vars:
  # Godot editor ports for this repo. Another Godot project on the same machine
  # keeps the defaults (6005 LSP, 6006 DAP, 6007 debugger). See godot/README.md.
  GODOT_LSP_PORT: "6305"
  GODOT_DAP_PORT: "6306"
  GODOT_DEBUG_PORT: "6307"
  SERVE_PORT: "8060"

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install the pinned toolchain and enable git hooks (idempotent)
    cmds:
      - mise trust --quiet .mise.toml
      - mise install
      - git config core.hooksPath .githooks
      - scripts/agent-loop-supervisor alias >/dev/null
      - scripts/install-godot
      - npm ci --ignore-scripts --no-audit --no-fund
      - npx playwright install --only-shell chromium
      - task: doctor

  doctor:
    desc: Verify every required tool is on PATH
    silent: true
    cmds:
      - |
        missing=0
        tools="task shellcheck shfmt actionlint gitleaks yq jq check-jsonschema yamllint gdlint gdformat gh tmux tmuxinator"
        tools="$tools tofu tflint tflint-ruleset-aws trivy"
        tools="$tools hugo lychee node npm npx"
        for t in $tools; do
          command -v "$t" >/dev/null 2>&1 || { echo "missing: $t"; missing=1; }
        done
        scripts/godot --headless --version >/dev/null 2>&1 || { echo "missing: pinned Godot (run: task setup)"; missing=1; }
        [ -d node_modules/playwright ] || { echo "missing: Playwright (run: task setup)"; missing=1; }
        # Ports in use are only a warning: it may be this repo's own editor.
        if command -v nc >/dev/null 2>&1; then
          for p in {{.GODOT_LSP_PORT}} {{.GODOT_DAP_PORT}} {{.GODOT_DEBUG_PORT}}; do
            if nc -z 127.0.0.1 "$p" >/dev/null 2>&1; then
              echo "warning: port $p is already in use (godot:editor needs it; is the mechapilot editor already open?)"
            fi
          done
        else
          echo "warning: nc not found, cannot check the Godot editor ports"
        fi
        if [ -z "${CI:-}" ] && [ "$(git config core.hooksPath)" != ".githooks" ]; then
          echo "git hooks not enabled (run: task setup)"; missing=1
        fi
        [ "$missing" -eq 0 ] && echo "doctor: ok"
        exit "$missing"

  fmt:
    desc: Format shell and GDScript in place
    cmds:
      - scripts/list-files sh | xargs shfmt -w
      - scripts/list-files gd | xargs gdformat

  lint:
    desc: All static checks (fast)
    cmds:
      - task: lint:sh
      - task: lint:js
      - task: lint:yaml
      - task: lint:actions
      - task: lint:schema
      - task: lint:gd
      - task: infra:validate
      - task: infra:lint
      - task: infra:scan
      - task: checks

  lint:sh:
    desc: POSIX sh, ShellCheck (all optional checks) and shfmt
    cmds:
      - scripts/list-files sh | xargs shellcheck
      - scripts/list-files sh | xargs shfmt -d

  lint:js:
    desc: Syntax-check the Node scripts (strict ES modules)
    cmds:
      - for f in scripts/*.mjs scripts/*/*.mjs tests/e2e/*.mjs; do node --check "$f" || exit 1; done

  lint:yaml:
    desc: yamllint (strict)
    cmds:
      - yamllint -s .

  lint:actions:
    desc: actionlint on GitHub workflows (runs ShellCheck on run blocks too)
    cmds:
      - actionlint

  lint:schema:
    desc: JSON Schema validation of every config that has a schema
    cmds:
      - check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
      - check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
      - check-jsonschema --schemafile schemas/taskfile.schema.json Taskfile.yml
      - check-jsonschema --schemafile schemas/claude-code-settings.schema.json .claude/settings.json .claude/agent-loop-settings.json
      # Authored here: the Agent Loop Supervisor's state snapshot and metrics events
      - check-jsonschema --check-metaschema schemas/agent-loop-snapshot.schema.json schemas/agent-loop-metrics-event.schema.json
      - check-jsonschema --schemafile schemas/agent-loop-snapshot.schema.json tests/fixtures/agent-loop/snapshot-*.json
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "${tmp}"' EXIT
        split -l 1 tests/fixtures/agent-loop/metrics.jsonl "${tmp}/event-"
        for f in "${tmp}"/event-*; do mv "${f}" "${f}.json"; done
        check-jsonschema --schemafile schemas/agent-loop-metrics-event.schema.json "${tmp}"/event-*.json
      - check-jsonschema --check-metaschema schemas/tmuxinator.schema.json
      - scripts/checks/no-erb .tmuxinator.yml
      - check-jsonschema --schemafile schemas/tmuxinator.schema.json .tmuxinator.yml
      - check-jsonschema --check-metaschema schemas/aws-eval-inventory.schema.json schemas/aws-eval-report.schema.json
      - check-jsonschema --schemafile schemas/aws-eval-inventory.schema.json tests/fixtures/aws-eval/inventory-*.json
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "${tmp}"' EXIT
        for skill in .claude/skills/*/SKILL.md; do
          [ -f "${skill}" ] || continue
          name="$(basename "$(dirname "${skill}")")"
          yq --front-matter=extract -o=json '.' "${skill}" >"${tmp}/${name}.json"
          [ "$(jq -r '.name' "${tmp}/${name}.json")" = "${name}" ] || { echo "${skill}: name must match its directory"; exit 1; }
          check-jsonschema --schemafile schemas/claude-skill-frontmatter.schema.json "${tmp}/${name}.json"
        done
      - check-jsonschema --check-metaschema schemas/infra-trivy-config.schema.json
      - check-jsonschema --schemafile schemas/infra-trivy-config.schema.json infra/trivy.yaml
      - check-jsonschema --check-metaschema schemas/lighthouserc.schema.json schemas/site-home.schema.json
      # Vendored: https://www.schemastore.org/package.json
      - check-jsonschema --schemafile schemas/package.schema.json package.json
      # Vendored: https://www.schemastore.org/hugo.json
      - check-jsonschema --schemafile schemas/hugo.schema.json site/config/_default/hugo.toml site/config/qa/hugo.toml site/config/production/hugo.toml
      # Vendored from html-validate 11.21.1 (dist/schema/config.json, published as https://html-validate.org/schemas/config.json)
      - check-jsonschema --schemafile schemas/html-validate-config.schema.json .htmlvalidate.json
      # Vendored: https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/schema.json
      - check-jsonschema --schemafile schemas/lychee.schema.json lychee.toml scripts/website-eval/lychee-online.toml
      # Authored here: the website-evaluation skill's report (scripts/website-eval/score)
      - check-jsonschema --check-metaschema schemas/website-eval.schema.json
      # Authored here (no upstream schema exists); pins the Lighthouse budgets
      - check-jsonschema --schemafile schemas/lighthouserc.schema.json lighthouserc.json
      # Authored here: the Marketing Site's home page copy
      - check-jsonschema --schemafile schemas/site-home.schema.json site/data/home.yaml
      # Vendored: https://www.schemastore.org/web-manifest.json
      - check-jsonschema --schemafile schemas/web-manifest.schema.json site/static/site.webmanifest
      - check-jsonschema --check-metaschema schemas/level.schema.json
      - check-jsonschema --schemafile schemas/level.schema.json godot/levels/*.json

  lint:gd:
    desc: gdlint and gdformat --check on all GDScript
    cmds:
      - |
        files="$(scripts/list-files gd)"
        if [ -z "$files" ]; then echo "lint:gd: no GDScript yet"; exit 0; fi
        echo "$files" | xargs gdlint
        echo "$files" | xargs gdformat --check

  checks:
    desc: Repository hygiene checks
    cmds:
      - scripts/checks/safe-filenames
      - scripts/checks/forbidden-paths
      - scripts/checks/large-files
      - scripts/checks/infra-no-identifiers
      - scripts/checks/infra-no-suppressions
      - scripts/checks/no-symlinks
      - scripts/checks/agent-loop-skill
      - scripts/checks/agent-loop-skill-commands
      - scripts/checks/threat-models
      - scripts/checks/godot-architecture
      - scripts/checks/godot-safe-api
      - scripts/checks/godot-addons

  infra:validate:
    desc: OpenTofu fmt -check, then offline init (-backend=false) and validate for every module and stack
    cmds:
      - scripts/infra validate

  infra:lint:
    desc: tflint (all terraform rules + the pinned AWS ruleset) on every module and stack
    cmds:
      - scripts/infra lint

  infra:scan:
    desc: trivy misconfiguration scan of infra/ (fails on any HIGH or CRITICAL finding)
    cmds:
      - scripts/infra scan

  infra:plan:
    desc: "Human only: plan a stack with your own AWS credentials (usage: task infra:plan -- --human [stack]); refuses CI and agents"
    cmds:
      - scripts/infra plan {{.CLI_ARGS}}

  infra:apply:
    desc: "Human only: apply the saved plan of a stack (usage: task infra:apply -- --human [stack]); refuses CI and agents"
    cmds:
      - scripts/infra apply {{.CLI_ARGS}}

  godot:install:
    desc: Install the pinned Godot editor and web export templates (checksum-verified)
    cmds:
      - scripts/install-godot

  godot:import:
    desc: Import the Godot project headless (fills godot/.godot on a fresh clone)
    cmds:
      - scripts/run-with-timeout 600 scripts/godot --headless --path godot --import

  godot:check:
    desc: Compile every project script and scene under maximum GDScript strictness
    cmds:
      - scripts/godot-compile-check

  godot:test:
    desc: GdUnit4 suites headless (JUnit in build/test-results/godot.xml)
    cmds:
      - scripts/godot-test build/test-results

  godot:export:web:
    desc: Headless single-threaded Web export to build/web
    cmds:
      - scripts/godot-export-web build/web

  godot:editor:
    desc: "Open the pinned Godot editor on this repo's own ports (see vars; `-- --dry-run` prints the command)"
    cmds:
      - scripts/godot-editor {{.CLI_ARGS}} {{.GODOT_LSP_PORT}} {{.GODOT_DAP_PORT}} {{.GODOT_DEBUG_PORT}}

  serve:
    desc: "Serve build/ at http://127.0.0.1:{{.SERVE_PORT}}/ (the game is at /web/)"
    cmds:
      - node scripts/serve-static.mjs build {{.SERVE_PORT}}

  e2e:web:
    desc: Export, then boot build/web in headless Chromium (no console errors allowed)
    cmds:
      - task: godot:export:web
      - scripts/e2e-web build/web

  secrets:
    desc: gitleaks over the full git history
    cmds:
      - gitleaks git --no-banner --redact .

  test:
    desc: Run the test suites (JUnit output in build/test-results)
    cmds:
      - rm -rf build/test-results
      - mkdir -p build/test-results
      - scripts/test-shell
      # scripts/godot-test also fails the run if shell.xml changes while it runs.
      - task: godot:test
      - scripts/checks/test-results-clean

  # ---- Marketing Site (site/, #30) ----
  # Hugo builds two environments into build/site/; Node tools come from
  # package-lock.json (npm ci) and Lighthouse drives a pinned Chrome for Testing.

  site:deps:
    desc: Install the pinned Node tooling (npm ci, no install scripts)
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci --ignore-scripts --no-audit --no-fund

  site:build:
    desc: Build the Marketing Site for QA and Production into build/site/
    cmds:
      - rm -rf build/site
      - |
        HUGO_PARAMS_COPYRIGHTYEAR="$(git log -1 --format=%cd --date=format:%Y)" || exit 1
        export HUGO_PARAMS_COPYRIGHTYEAR
        for env in qa production; do
          hugo build --source site --environment "${env}" --panicOnWarning --printPathWarnings --cleanDestinationDir || exit 1
        done
      - scripts/site-budget build/site/qa/mechapilot build/site/production

  site:static:
    desc: Build the site and validate every page with html-validate (no browser, no network, no localhost)
    cmds:
      - task: site:deps
      - task: site:build
      - scripts/site-no-overrides
      - npx --no-install html-validate --max-warnings 0 "build/site/**/*.html"

  site:validate:
    desc: Validate every built page with html-validate, then load each one in the pinned Chrome (no script, no third-party requests, no console output)
    cmds:
      - task: site:static
      - scripts/site-observe build/site/qa build/site/production

  site:links:
    desc: Check every internal link and fragment in both builds with lychee (offline)
    cmds:
      - task: site:build
      - scripts/site-no-overrides
      # lychee exits 0 when its glob matches nothing, so also require that links were checked.
      - |
        for env in qa production; do
          out="build/lychee-${env}.json"
          lychee --config lychee.toml --root-dir "{{.ROOT_DIR}}/build/site/${env}" --format json --output "${out}" \
            "build/site/${env}/**/*.html" || { jq '.error_map' "${out}"; exit 1; }
          jq -e '.successful > 0 and .errors == 0' "${out}" >/dev/null || { echo "site:links: ${env}: no links checked"; exit 1; }
          jq -r --arg env "${env}" '"site:links: \($env): \(.successful) links OK, \(.excludes) excluded (external, offline)"' "${out}"
        done

  site:audit:
    desc: Lighthouse CI against the built Production site, with the budgets in lighthouserc.json
    cmds:
      - task: site:deps
      - task: site:build
      - rm -rf build/lighthouse .lighthouseci
      - |
        chrome="$(scripts/site-chrome)" || exit 1
        CHROME_PATH="${chrome}" npx --no-install lhci autorun --config=lighthouserc.json

  site:
    desc: Every Marketing Site check (build, validate, links, audit)
    cmds:
      - task: site:validate
      - task: site:links
      - task: site:audit

  site:serve:
    desc: Preview the Marketing Site locally with live reload
    cmds:
      - hugo server --source site

  website:eval:
    desc: "Measure one page and score it (usage: task website:eval -- <site-dir | url>); remote URLs are for humans and the website-evaluation skill, never CI"
    cmds:
      - task: site:deps
      - scripts/website-eval/collect {{.CLI_ARGS}}

  ci:fast:
    desc: Pre-push gate (lint, strict compile, tests)
    cmds:
      - task: lint
      - task: godot:check
      - task: test

  ci:sandbox:
    desc: "Agent Loop session gate: task ci minus the Chrome steps that bind localhost (site-observe, Lighthouse); the ci check runs them"
    cmds:
      - task: ci:fast
      - task: site:static
      - task: site:links
      - task: secrets

  ci:
    desc: The full gate (the required `ci` status check runs exactly this)
    cmds:
      # The whole run is wrapped in a tree check: anything tracked or untracked (not
      # gitignored) that changed outside build/ and godot/.godot/ fails the gate.
      - task: ci:guard:begin
      - task: ci:fast
      - task: site
      - task: e2e:web
      - task: secrets
      - task: ci:guard:end

  ci:guard:begin:
    desc: "Internal to `task ci`: snapshot the tree with a private copy of scripts/tree-guard"
    vars:
      GUARD_DIR:
        sh: printf '%s/mechapilot-ci-guard-%s' "${TMPDIR:-/tmp}" "$(pwd -P | cksum | cut -d ' ' -f 1)"
    cmds:
      # A private copy, so a run that rewrote scripts/tree-guard can't vouch for itself.
      - |
        set -e
        rm -rf "{{.GUARD_DIR}}"
        mkdir -p "{{.GUARD_DIR}}/scripts"
        cp scripts/tree-guard scripts/lib-godot "{{.GUARD_DIR}}/scripts/"
        cp .godot-version "{{.GUARD_DIR}}/"
        "{{.GUARD_DIR}}/scripts/tree-guard" snapshot "{{.GUARD_DIR}}/tree.before" "$(pwd -P)"

  ci:guard:end:
    desc: "Internal to `task ci`: fail if the tree changed since ci:guard:begin"
    vars:
      GUARD_DIR:
        sh: printf '%s/mechapilot-ci-guard-%s' "${TMPDIR:-/tmp}" "$(pwd -P | cksum | cut -d ' ' -f 1)"
    cmds:
      - |
        set -e
        rc=0
        "{{.GUARD_DIR}}/scripts/tree-guard" verify "{{.GUARD_DIR}}/tree.before" "$(pwd -P)" || rc=$?
        rm -rf "{{.GUARD_DIR}}"
        exit "${rc}"
  dev:
    desc: Start the tmux dev session (.tmuxinator.yml), or attach if it is already running
    interactive: true
    cmds:
      - scripts/dev/session start

  dev:stop:
    desc: Stop the tmux dev session (no-op if it isn't running)
    cmds:
      - scripts/dev/session stop

  dev:check:
    desc: Render .tmuxinator.yml with `tmuxinator debug` and validate the result
    cmds:
      - scripts/dev/session check

  autostart:install:
    desc: "Optional: start the dev session detached at login (launchd on macOS, systemd --user on Linux)"
    cmds:
      - scripts/autostart/autostart install

  autostart:uninstall:
    desc: "Optional: remove the login autostart"
    cmds:
      - scripts/autostart/autostart uninstall

  autostart:status:
    desc: Report whether login autostart is installed and whether the dev session is running
    cmds:
      - scripts/autostart/autostart status

  # ---- Agent Loop (#20): the Supervisor, its metrics and the session ----

  loop:start:
    desc: "Human only: pin the runtime if unpinned, run preflight, clear the stop file and start the Supervisor in the loops window"
    cmds:
      - scripts/agent-loop-supervisor start

  loop:pin:
    desc: "Human only: pin the Agent Loop session's runtime (settings, hooks, status line, skill) to a commit on origin/main (usage: task loop:pin -- <sha>)"
    cmds:
      - scripts/agent-loop-supervisor pin {{.CLI_ARGS}}

  loop:confirm-token:
    desc: "Human only: confirm the loop's token has no Workflows, Environments, Variables, Secrets, Deployments or Administration permission"
    interactive: true
    cmds:
      - scripts/agent-loop-supervisor confirm-token

  loop:stop:
    desc: Ask the Supervisor to stop after the current issue (sets the stop file)
    cmds:
      - scripts/agent-loop-supervisor stop

  loop:status:
    desc: Show the Agent Loop's state (machine alias, Supervisor, session, context, recent events)
    cmds:
      - scripts/agent-loop-supervisor status

  loop:report:
    desc: Summarize the Agent Loop's metrics (delivered per day, median time to merge, stalls, restarts, nudges)
    cmds:
      - scripts/agent-loop-report {{.CLI_ARGS}}

  verify:acceptance:
    desc: "Prove an issue's acceptance criteria (usage: task verify:acceptance -- <issue#>)"
    cmds:
      - scripts/verify-acceptance {{.CLI_ARGS}}

  verify:guard:
    desc: "Classify changes that touch the verification stack (exit 3 = verification change)"
    cmds:
      - scripts/checks/verification-guard

  merge-gate:
    desc: "Decide (and with --merge, perform) a PR merge using main's gate scripts (usage: task merge-gate -- <pr> [--merge])"
    cmds:
      - scripts/merge-gate {{.CLI_ARGS}}
