version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # The LAN preview's nginx image (compose.yaml): version tag and digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
