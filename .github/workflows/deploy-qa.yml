name: deploy-qa

# Automatic: every push to main whose ci run succeeded is published to the QA
# Environment on GitHub Pages (#18): the Marketing Site's QA build at
# https://aallbrig.github.io/mechapilot/ and the game at .../game/. The game
# is the exact web export that ci built, tested and booted for that commit
# (its `web` artifact), never a rebuild. workflow_run always runs this file
# from the default branch, and every field of the triggering run reaches a
# script only through env, never through ${{ }} in a run block.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One Pages deploy at a time; a running deploy is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only to download the triggering ci run's web artifact.
      actions: read
    outputs:
      deploy: ${{ steps.guard.outputs.deploy }}
    env:
      CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: task hugo jq yq

      - name: Guard (a green ci push run on main's tip)
        id: guard
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          CI_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: scripts/pages/guard >>"${GITHUB_OUTPUT}"

      - name: Download the web export ci tested
        if: steps.guard.outputs.deploy == 'yes'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: build/web
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build the QA site and assemble the Pages artifact
        if: steps.guard.outputs.deploy == 'yes'
        run: |
          task site:build
          task pages:assemble

      - name: Upload the Pages artifact
        if: steps.guard.outputs.deploy == 'yes'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages/

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.deploy == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the deploy step holds these, and it runs no repository code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: jq

      # The Pages CDN can serve the previous deploy for a short while.
      - name: QA smoke check (/, /game/ and the game's .pck)
        env:
          QA_SMOKE_ATTEMPTS: "12"
          QA_SMOKE_DELAY: "15"
        run: scripts/checks/qa-smoke
