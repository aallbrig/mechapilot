name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only everywhere: the gate never writes to the repo. Merging is decided by
# scripts/merge-gate, which re-checks everything with main's copies of the scripts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: true

      # The pinned editor and the two web templates (about 100 MB). Restore, install
      # (which re-hashes every installed file against .godot-sha512sums, and
      # reinstalls from verified downloads on any mismatch), then save at once,
      # before any project code runs, so nothing a test does can enter the cache.
      - name: Restore Godot
        id: godot-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mechapilot/godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.godot-version', '.godot-sha512sums', 'scripts/install-godot', 'scripts/lib-godot') }}

      - name: Install Godot
        run: scripts/install-godot

      - name: Save Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mechapilot/godot
          key: ${{ steps.godot-cache.outputs.cache-primary-key }}

      # Same pattern: saved right after install, before any project code runs.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright and headless Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # scripts/godot-test runs every Godot test process under bubblewrap on Linux
      # (read-only filesystem, private user:// and report dir, no network).
      # Pinned by version and SHA-256 as a .deb from the Ubuntu archive, so it does not
      # depend on which Ubuntu release ubuntu-latest is or on apt index state. Its
      # dependencies (libc6, libcap2, libselinux1) are on every image.
      - name: Install bubblewrap
        env:
          BWRAP_DEB_URL: https://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb
          BWRAP_DEB_SHA256: 2461f1beee9cb04c8942739fe1a2b37e7b7c2a3d518f0779dc75f9245baa3094
        run: |
          deb="${RUNNER_TEMP}/bubblewrap.deb"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "${deb}" "${BWRAP_DEB_URL}"
          echo "${BWRAP_DEB_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "${deb}"
          bwrap --version
          # Ubuntu can restrict unprivileged user namespaces through AppArmor;
          # this throwaway runner allows them so bwrap can sandbox without setuid.
          if ! bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true

      - name: task ci
        run: task ci

      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: build/web/
          if-no-files-found: error

      - name: Verification guard (informational; the merge gate recomputes it)
        if: github.event_name == 'pull_request'
        run: |
          rc=0
          scripts/checks/verification-guard || rc=$?
          [ "${rc}" -eq 0 ] || [ "${rc}" -eq 3 ]

      - name: Acceptance evidence
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          repo_url="https://github.com/${GITHUB_REPOSITORY}/issues/"
          gh pr view "${PR_NUMBER}" --json closingIssuesReferences >"${RUNNER_TEMP}/links.json"
          foreign="$(jq -r --arg url "${repo_url}" '[.closingIssuesReferences[] | select(.url | startswith($url) | not)] | length' "${RUNNER_TEMP}/links.json")"
          if [ "${foreign}" -ne 0 ]; then echo "::error::Linked issues must be in this repository."; exit 1; fi
          issues="$(jq -r '.closingIssuesReferences[].number' "${RUNNER_TEMP}/links.json")"
          if [ -z "${issues}" ]; then
            case "${PR_AUTHOR}" in
              "dependabot[bot]") echo "Dependabot PR: no linked issue required."; exit 0 ;;
              *) echo "::error::No linked issue. Add 'Closes #<n>' to the PR body."; exit 1 ;;
            esac
          fi
          # Record outside build/ so nothing the tests write can pre-seed it.
          record="${RUNNER_TEMP}/acceptance.tsv"
          : >"${record}"
          rc=0
          for n in ${issues}; do ACCEPTANCE_RECORD="${record}" scripts/verify-acceptance "${n}" || rc=1; done
          cp "${record}" build/test-results/acceptance.tsv
          exit "${rc}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: error
